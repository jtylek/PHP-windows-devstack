name: distribution

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/distribution.yml
      - installer/**
      - scripts/install-runtime.ps1
      - scripts/setup-runtime.ps1
      - scripts/prepare-upgrade.ps1
      - scripts/merge-mariadb-template.ps1
      - scripts/test-installer-upgrade.ps1
      - scripts/verify-runtime-manifest.ps1
      - runtime/manifest/components.json
      - runtime/templates/**
      - src/**
      - www/**

permissions:
  contents: write
  actions: read

concurrency:
  group: distribution-${{ github.ref }}
  cancel-in-progress: false

env:
  RELEASE_TAG: v1.0.0-rc.12
  APACHE_ARTIFACT_ID: "11881045146"
  APACHE_SHA256: 10b310843c4763d7efa2c04d3e474c35bb9dee927babb5a167cbebd1545eff3f

jobs:
  build-installer:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Download and verify Apache release payload
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Path artifacts/apache-release -Force | Out-Null
          gh api "repos/${{ github.repository }}/actions/artifacts/$env:APACHE_ARTIFACT_ID/zip" > artifacts/apache-artifact.zip
          Expand-Archive artifacts/apache-artifact.zip artifacts/apache-release
          $archive = 'artifacts/apache-release/apache-httpd-2.4.69-win64-vs17.zip'
          $actual = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -cne $env:APACHE_SHA256) {
            throw "Apache artifact hash mismatch: $actual"
          }

      - name: Create permanent release candidate and upload Apache
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:RELEASE_TAG *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:RELEASE_TAG --target $env:GITHUB_SHA --prerelease --title 'PHP Windows DevStack 1.0 RC12' --notes 'Unsigned Windows 10/11 x64 release candidate.'
          }
          gh release upload $env:RELEASE_TAG artifacts/apache-release/* --clobber

      - name: Publish self-contained control panel
        shell: pwsh
        run: |
          dotnet publish src/DevStack.ControlPanel/DevStack.ControlPanel.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            --output artifacts/publish `
            -p:PublishSingleFile=false

      - name: Compile setup program
        shell: pwsh
        run: |
          $compiler = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $compiler)) {
            throw 'Inno Setup 6 is not installed on this Windows runner.'
          }
          & $compiler installer/DevStack.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE." }

      - name: Install silently and verify runtime layout
        shell: pwsh
        run: |
          $setup = 'artifacts/PHP-Windows-DevStack-Setup-1.0.0-rc.12-win-x64.exe'
          $testRoot = 'C:\ds-test'
          $installerLog = 'C:\ds-installer.log'
          $process = Start-Process $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=$testRoot", "/LOG=$installerLog" -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            Get-Content $installerLog -ErrorAction SilentlyContinue
            Get-Content "$testRoot\logs\setup-runtime.log" -ErrorAction SilentlyContinue
            throw "Installer test failed with exit code $($process.ExitCode)."
          }
          foreach ($path in @(
            'DevStack.ControlPanel.exe',
            'runtime/apache/bin/httpd.exe',
            'runtime/php/php.exe',
            'runtime/mariadb/bin/mariadbd.exe',
            'runtime/certificates/cacert.pem',
            'data/mariadb/mysql',
            '.devstack-ready'
          )) {
            if (-not (Test-Path (Join-Path $testRoot $path))) {
              Get-Content $installerLog -ErrorAction SilentlyContinue
              Get-Content "$testRoot\logs\setup-runtime.log" -ErrorAction SilentlyContinue
              throw "Installed path is missing: $path"
            }
          }

          dotnet run --project tests/DevStack.TerminalChecks/DevStack.TerminalChecks.csproj -- --render $testRoot
          if ($LASTEXITCODE -ne 0) { throw 'Could not render the fresh installation PHP configuration.' }
          $phpIni = Get-Content "$testRoot\runtime\config\generated\php.ini" -Raw
          $bundlePath = "$testRoot\runtime\certificates\cacert.pem".Replace('\\', '/')
          if ($phpIni -notmatch [regex]::Escape("curl.cainfo=`"$bundlePath`"") -or
              $phpIni -notmatch [regex]::Escape("openssl.cafile=`"$bundlePath`"")) {
            throw 'Generated PHP configuration does not point cURL and OpenSSL at the bundled CA file.'
          }
          $probe = Join-Path $env:RUNNER_TEMP 'php-ca-probe.php'
          @'
          <?php
          $curl = curl_init('https://curl.se/');
          curl_setopt($curl, CURLOPT_RETURNTRANSFER, true);
          curl_setopt($curl, CURLOPT_TIMEOUT, 20);
          curl_exec($curl);
          echo 'curl=', curl_errno($curl), PHP_EOL;
          $stream = @file_get_contents('https://curl.se/');
          echo 'openssl=', $stream === false ? 'failed' : 'ok', PHP_EOL;
          '@ | Set-Content -LiteralPath $probe -Encoding ascii
          $probeOutput = & "$testRoot\runtime\php\php.exe" -c "$testRoot\runtime\config\generated\php.ini" $probe 2>&1
          if ($LASTEXITCODE -ne 0 -or $probeOutput -notmatch 'curl=0' -or $probeOutput -notmatch 'openssl=ok') {
            $probeOutput
            throw 'PHP CLI could not validate HTTPS with the bundled CA certificate file.'
          }

      - name: Verify in-place update preserves existing data
        shell: powershell
        run: ./scripts/test-installer-upgrade.ps1 -SetupPath "${{ github.workspace }}/artifacts/PHP-Windows-DevStack-Setup-1.0.0-rc.12-win-x64.exe"

      - name: Write installer checksum
        shell: pwsh
        run: |
          $setup = 'artifacts/PHP-Windows-DevStack-Setup-1.0.0-rc.12-win-x64.exe'
          $hash = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  PHP-Windows-DevStack-Setup-1.0.0-rc.12-win-x64.exe" | Set-Content "$setup.sha256" -Encoding ascii

      - name: Upload setup to release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload $env:RELEASE_TAG `
            artifacts/PHP-Windows-DevStack-Setup-1.0.0-rc.12-win-x64.exe `
            artifacts/PHP-Windows-DevStack-Setup-1.0.0-rc.12-win-x64.exe.sha256 `
            --clobber

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: PHP-Windows-DevStack-Setup-1.0.0-rc.12-win-x64
          path: |
            artifacts/PHP-Windows-DevStack-Setup-1.0.0-rc.12-win-x64.exe
            artifacts/PHP-Windows-DevStack-Setup-1.0.0-rc.12-win-x64.exe.sha256
          if-no-files-found: error
          retention-days: 14
