name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Validate and build
        shell: pwsh
        run: ./scripts/build.ps1
      - name: Check PHP terminal configuration
        shell: pwsh
        run: dotnet run --project tests/DevStack.TerminalChecks/DevStack.TerminalChecks.csproj
      - name: Check native Mailpit integration
        shell: powershell
        run: |
          $runtimeRoot = Join-Path $env:RUNNER_TEMP 'devstack-mailpit-runtime'
          ./scripts/install-runtime.ps1 -Component mailpit -DestinationRoot $runtimeRoot
          dotnet run --project tests/DevStack.MailpitChecks/DevStack.MailpitChecks.csproj -- (Join-Path $runtimeRoot 'mailpit')
          if ($LASTEXITCODE -ne 0) { throw 'Mailpit integration checks failed.' }
