name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Validate and build
        shell: pwsh
        run: ./scripts/build.ps1
      - name: Check PHP terminal configuration
        shell: pwsh
        run: dotnet run --project tests/DevStack.TerminalChecks/DevStack.TerminalChecks.csproj
